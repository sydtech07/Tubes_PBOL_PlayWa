<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="toolbar" class="toolbar">
  <div class="tabs">
    <button type="button" class="tab on" data-cat="">Semua</button>
    <button type="button" class="tab" th:each="c : ${categories}" th:attr="data-cat=${c}" th:text="${c}"></button>
  </div>
  <input class="search" type="search" placeholder="Cari item..." aria-label="Cari item">
</div>
</body>
</html>
