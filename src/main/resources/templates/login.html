<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Play W.A</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <style>
    .gate{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 0%,#1b1f2b,#090a0d 60%)}
    .gate form{width:min(380px,100%);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:28px;display:flex;flex-direction:column;gap:14px}
    .gate h1{font-size:30px;text-align:center}.gate p.sub{text-align:center;color:var(--muted);margin-top:-8px}
    .gate label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:5px}
    .gate input{background:#07080a;border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--text);font:inherit}
    .gate input:focus{outline:2px solid var(--gold);outline-offset:1px}
    .err{background:var(--red);border:1px solid #5a2024;border-radius:10px;padding:9px 12px;font-size:14px}
    .gate .btn{padding:11px;background:#3a2d12;border-color:#5a4720;font-weight:600}
    .gate .alt{text-align:center;font-size:14px;color:var(--muted)}.gate .alt a{color:var(--gold)}
  </style>
</head>
<body>
<div class="gate">
  <form method="post" th:action="${mode == 'register'} ? '/register' : '/login'">
    <h1>Play W.A</h1>
    <p class="sub" th:text="${mode == 'register'} ? 'Buat petualang barumu' : 'Masuk ke dunia Haven'"></p>
    <div class="err" th:if="${error}" th:text="${error}"></div>
    <label>Username<input name="username" autocomplete="username" required autofocus></label>
    <label th:if="${mode == 'register'}">Nama karakter<input name="characterName" required></label>
    <label>Password<input type="password" name="password" autocomplete="current-password" required></label>
    <button class="btn" th:text="${mode == 'register'} ? 'Buat akun' : 'Masuk'"></button>
    <p class="alt" th:if="${mode != 'register'}">Belum punya akun? <a href="/register">Daftar</a></p>
    <p class="alt" th:if="${mode == 'register'}">Sudah punya akun? <a href="/login">Masuk</a></p>
  </form>
</div>
</body>
</html>
